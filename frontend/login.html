<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Show & Go Auto Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(250, 204, 21, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        input:focus {
            border-color: #facc15 !important;
            box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.2);
        }
        .glass-btn {
            transition: all 0.3s ease;
        }
        .glass-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(250, 204, 21, 0.3);
        }
    </style>
</head>
<body>

    <div class="w-full max-w-md px-4">
        <!-- Logo Area -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex flex-col items-center group">
                <img src="assets/images/logo.png" alt="Logo" class="h-20 w-20 object-contain mb-2 transition-transform group-hover:scale-110">
                <span class="text-2xl font-black text-yellow-400 tracking-tighter">SHOW & GO</span>
                <span class="text-xs text-white tracking-[0.3em] font-bold">REPAIR SHOP</span>
            </a>
        </div>

        <!-- Login Card -->
        <div class="login-card p-8 rounded-3xl">
            <h2 class="text-2xl font-bold mb-2 text-center">Welcome Back</h2>
            <p class="text-slate-400 text-sm text-center mb-8">Sign in to manage your builds and orders</p>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2 ml-1">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                            <i class="fa fa-envelope"></i>
                        </span>
                        <input type="email" id="email" required 
                            class="w-full pl-11 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl outline-none transition text-sm"
                            placeholder="name@example.com">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between mb-2 ml-1">
                        <label class="text-xs font-bold uppercase tracking-widest text-slate-400">Password</label>
                        <a href="#" id="forgotPasswordBtn" class="text-xs text-yellow-400 hover:underline">Forgot?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                            <i class="fa fa-lock"></i>
                        </span>
                        <input type="password" id="password" required 
                            class="w-full pl-11 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl outline-none transition text-sm"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="loginBtn" 
                    class="glass-btn w-full bg-yellow-400 text-black font-black py-4 rounded-xl uppercase tracking-widest text-sm mt-4">
                    Sign In
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-700/50 text-center">
                <p class="text-slate-400 text-sm">
                    Don't have an account? 
                    <p class="text-slate-400 text-sm">
    Don't have an account? 
    <a href="register.html" class="text-yellow-400 font-bold hover:underline">Create one</a>
</p>

            </div>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-8">
            <a href="index.html" class="text-slate-500 hover:text-white text-sm transition">
                <i class="fa fa-arrow-left mr-2"></i> Back to Homepage
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://jimjbjtlekdytvnpyykw.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppbWpianRsZWtkeXR2bnB5eWt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NDM3NzQsImV4cCI6MjA4ODAxOTc3NH0.SZa7CNAx0SWBNsuDqcnrNYS6iwnOmBJ3tD1mSQETZhE";

    // Use the global 'supabase' object provided by the CDN to create your client
    // We name the variable 'supabaseClient' to avoid conflicting with the library name
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        loginBtn.disabled = true;
        loginBtn.innerText = "AUTHENTICATING...";

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert("Login Error: " + error.message);
                loginBtn.disabled = false;
                loginBtn.innerText = "SIGN IN";
            } else {
                // Successful login
                window.location.href = "account.html";
            }
        } catch (err) {
            console.error("Unexpected error:", err);
            alert("An unexpected error occurred. Check the console.");
            loginBtn.disabled = false;
            loginBtn.innerText = "SIGN IN";
        }
    });
   document.getElementById('forgotPasswordBtn').onclick = async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;

    if (!email) {
        alert("Please enter your email address first.");
        return;
    }

    const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        // MUST match exactly what you put in the Redirect URLs list in Supabase
        redirectTo: 'https://showandgo4x4.com/reset-password.html', 
    });

    if (error) {
        alert("Error: " + error.message);
    } else {
        alert("Success! Check your email at " + email + " for the reset link.");
    }
};
</script>
</body>
</html>
