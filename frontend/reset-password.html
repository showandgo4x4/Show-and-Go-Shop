<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Show & Go</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-6">
    <div class="bg-slate-800 p-8 rounded-2xl border border-yellow-500/20 w-full max-w-md shadow-2xl">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-yellow-400">Set New Password</h2>
            <p class="text-slate-400 text-sm mt-2">Enter your new secure password below.</p>
        </div>

        <div class="space-y-4">
            <input type="password" id="newPassword" placeholder="New Password" 
                class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl outline-none focus:border-yellow-400 transition text-sm">
            
            <button id="updateBtn" 
                class="w-full bg-yellow-400 text-black font-bold py-3 rounded-xl uppercase tracking-wider hover:bg-yellow-300 transition shadow-lg shadow-yellow-400/10">
                Update Password
            </button>
        </div>

        <div class="mt-6 text-center">
            <a href="login.html" class="text-xs text-slate-500 hover:text-yellow-400 transition">Back to Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // 1. Define your credentials as strings with "quotes"
    const SUPABASE_URL = "https://jimjbjtlekdytvnpyykw.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppbWpianRsZWtkeXR2bnB5eWt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NDM3NzQsImV4cCI6MjA4ODAxOTc3NH0.SZa7CNAx0SWBNsuDqcnrNYS6iwnOmBJ3tD1mSQETZhE";

    // 2. Initialize the client using the variables above
    // Use 'supabaseClient' to avoid conflict with the global 'supabase' object
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 3. Logic for the button
    document.getElementById('updateBtn').onclick = async () => {
        const newPassword = document.getElementById('newPassword').value;
        const updateBtn = document.getElementById('updateBtn');

        if (!newPassword || newPassword.length < 6) {
            alert("Password must be at least 6 characters.");
            return;
        }

        updateBtn.disabled = true;
        updateBtn.innerText = "UPDATING...";

        try {
            // This relies on the auth token in the URL from your email link
            const { data, error } = await supabaseClient.auth.updateUser({ 
                password: newPassword 
            });

            if (error) {
                alert("Update Error: " + error.message);
                updateBtn.disabled = false;
                updateBtn.innerText = "UPDATE PASSWORD";
            } else {
                alert("Success! Your password has been changed.");
                window.location.href = "login.html";
            }
        } catch (err) {
            console.error(err);
            updateBtn.disabled = false;
            updateBtn.innerText = "UPDATE PASSWORD";
        }
    };
</script>
</body>
</html>
