<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Show & Go Auto Shop</title>
    <link rel="icon" href="assets/images/logo.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

        body { font-family: 'Poppins', sans-serif; }
        .section-fade { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .nav-active { background-color: #fff7ed; color: #f97316 !important; font-weight: 700; border-left: 4px solid #f97316; }
        @media (max-width: 768px) {

        /* Navbar Specific Styling */
        nav { background: #0f172a; border-bottom: 1px solid rgba(250, 204, 21, 0.1); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

</head>

<body class="bg-gray-100">

<!-- FIXED NAVBAR -->
<nav class="sticky top-0 z-[1000] w-full transition-all">

            </div>
        </a>
        <div class="hidden lg:flex items-center space-x-8">
            <div class="flex items-center space-x-6 text-sm font-semibold text-gray-300">
                <a href="index.html" class="hover:text-yellow-400 transition">Home</a>
                <a href="shop.html" class="hover:text-yellow-400 transition">Shop</a>
                <a href="about.html" class="hover:text-yellow-400 transition">About</a>
                <a href="camping.html" class="hover:text-yellow-400 transition">Community</a>
                <a href="store-locator.html" class="hover:text-yellow-400 transition">Location</a>
                <a href="account.html" class="text-yellow-400 transition underline underline-offset-8 decoration-2">My Account</a>
            </div>
            <div class="flex items-center space-x-3">
                <a href="quote.html" class="bg-yellow-400 text-black px-5 py-2 rounded-full font-bold text-xs uppercase hover:bg-yellow-300 transition shadow-lg shadow-yellow-400/20">Get Quote</a>
                <a href="inquiry.html" class="bg-yellow-400 text-black px-5 py-2 rounded-full font-bold text-xs uppercase hover:bg-yellow-300 transition shadow-lg shadow-yellow-400/20">Be a Partner</a>
            </div>
        </div>
        <button id="mobileMenuBtn" class="lg:hidden text-yellow-400 text-3xl"><i class="fa-solid fa-bars"></i></button>
    </div>
    
    <!-- Mobile Dropdown -->
    <div id="mobileMenu" class="hidden lg:hidden bg-slate-900 border-b border-yellow-500/20 p-6 space-y-4">
        <a href="index.html" class="block text-white font-medium">Home</a>
        <a href="shop.html" class="block text-white font-medium">Shop</a>
        <a href="about.html" class="block text-white font-medium">About Us</a>
        <a href="camping.html" class="block text-white font-medium">Community</a>
        <a href="store-locator.html" class="block text-white font-medium">Location</a>
        <a href="account.html" class="block text-yellow-400 font-bold">My Account</a>
        <hr class="border-gray-800">
        <a href="quote.html" class="block bg-yellow-400 text-black p-3 rounded-xl font-bold text-center uppercase">Get Quote</a>
        <a href="inquiry.html" class="block bg-yellow-400 text-black p-3 rounded-xl font-bold text-center uppercase mt-2">Be a Partner</a>
    </div>
</nav>

<!-- Main Container -->
<div class="max-w-6xl mx-auto md:flex md:gap-6 md:p-6 mt-6">
    
    <!-- Navigation Menu (Sidebar) -->
    <aside class="w-full md:w-64 shrink-0">
        <div class="bg-white shadow-sm md:rounded-lg overflow-hidden border border-gray-200">
            <!-- User Info -->
            <div class="hidden md:flex items-center gap-3 p-6 border-b">
                <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 border border-gray-200"><i class="fa fa-user"></i></div>
                <div class="font-bold text-sm truncate text-gray-800" id="displayUsername">User</div>
            </div>

            <!-- Sidebar Buttons -->
            <nav class="flex md:flex-col overflow-x-auto md:overflow-visible scrollbar-hide">
                <button id="sidebarProfileBtn" class="nav-active flex-1 md:flex-none text-center md:text-left px-4 py-4 md:py-3 text-xs md:text-sm transition flex flex-col md:flex-row items-center gap-2 md:gap-3">
                    <i class="fa fa-user text-blue-500"></i> <span>Profile</span>
                </button>
                <button id="sidebarOrdersBtn" class="flex-1 md:flex-none text-center md:text-left px-4 py-4 md:py-3 text-xs md:text-sm transition flex flex-col md:flex-row items-center gap-2 md:gap-3 text-gray-600 hover:bg-gray-50">
                    <i class="fa fa-clipboard-list text-orange-500"></i> <span>Purchases</span>
                </button>
                <button id="sidebarPaymentsBtn" class="flex-1 md:flex-none text-center md:text-left px-4 py-4 md:py-3 text-xs md:text-sm transition flex flex-col md:flex-row items-center gap-2 md:gap-3 text-gray-600 hover:bg-gray-50">
                    <i class="fa fa-credit-card text-green-500"></i> <span>Payments</span>
                </button>
                <button id="logoutBtn" class="flex-1 md:flex-none text-center md:text-left px-4 py-4 md:py-3 text-xs md:text-sm transition flex flex-col md:flex-row items-center gap-2 md:gap-3 text-red-500 hover:bg-red-50">
                    <i class="fa fa-sign-out-alt"></i> <span>Logout</span>
                </button>
            </nav>
        </div>
    </aside>

    <!-- Content Area -->
    <main class="flex-1 mt-4 md:mt-0 px-4 md:px-0 pb-10">
        <!-- Sections (Profile, Orders, Payments) remain the same -->
        <section id="profileSection" class="section-fade bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <div class="border-b pb-4 mb-6">
                <h2 class="text-lg font-bold text-gray-800">My Profile</h2>
                <p class="text-xs text-gray-500">Manage your account information</p>
            </div>
            
            <div class="space-y-4 max-w-lg">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500">Username</label>
                    <input type="text" id="profileUsername" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-orange-500 outline-none transition">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500">Email Address</label>
                    <input type="email" id="profileEmail" disabled class="w-full p-2.5 border rounded-lg text-sm bg-gray-50 text-gray-400 cursor-not-allowed">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500">Phone Number</label>
                    <input type="text" id="profileContact" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-orange-500 outline-none transition">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500">Shipping Address</label>
                    <textarea id="profileAddress" rows="3" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-orange-500 outline-none transition"></textarea>
                </div>
                <button id="saveProfileBtn" class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold shadow-md hover:bg-orange-600 transition mt-4">Save Changes</button>
            </div>
        </section>

        <!-- Orders Section -->
        <section id="ordersSection" class="hidden section-fade">
            <div class="bg-white sticky top-[80px] z-10 border rounded-t-lg flex overflow-x-auto scrollbar-hide border-gray-200">
                <button onclick="filterUserOrders('all')" id="tab-all" class="px-6 py-4 text-xs font-bold border-b-2 border-orange-500 text-orange-500 uppercase flex-shrink-0">All</button>
                <button onclick="filterUserOrders('pending')" id="tab-pending" class="px-6 py-4 text-xs font-bold text-gray-500 uppercase flex-shrink-0">To Pay</button>
                <button onclick="filterUserOrders('preparing')" id="tab-preparing" class="px-6 py-4 text-xs font-bold text-gray-500 uppercase flex-shrink-0">To Ship</button>
                <button onclick="filterUserOrders('shipped')" id="tab-shipped" class="px-6 py-4 text-xs font-bold text-gray-500 uppercase flex-shrink-0">To Receive</button>
                <button onclick="filterUserOrders('delivered')" id="tab-delivered" class="px-6 py-4 text-xs font-bold text-gray-500 uppercase flex-shrink-0">Completed</button>
            </div>
            <div id="ordersList" class="mt-4 space-y-4"></div>
        </section>

        <!-- Payments Section -->
        <section id="paymentsSection" class="hidden section-fade bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-gray-800">Payments</h2>
                <button id="addPaymentBtn" class="text-xs font-bold text-orange-500 hover:underline">+ Add Card</button>
            </div>
            <div id="paymentList" class="grid grid-cols-1 gap-4"></div>
        </section>
    </main>
</div>

<!-- JS remains largely the same, but includes Mobile Menu Logic -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// --- NAVBAR MOBILE TOGGLE ---
const mobileBtn = document.getElementById("mobileMenuBtn");
const mobileMenu = document.getElementById("mobileMenu");
const mobileIcon = mobileBtn.querySelector("i");

mobileBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("hidden");
    mobileIcon.classList.toggle("fa-bars");
    mobileIcon.classList.toggle("fa-xmark");
});

// --- ACCOUNT LOGIC ---
let supabaseClient;
let currentUserOrders = [];
let user;

document.addEventListener("DOMContentLoaded", async () => {
    const SUPABASE_URL = "https://jimjbjtlekdytvnpyykw.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppbWpianRsZWtkeXR2bnB5eWt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NDM3NzQsImV4cCI6MjA4ODAxOTc3NH0.SZa7CNAx0SWBNsuDqcnrNYS6iwnOmBJ3tD1mSQETZhE";
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }

    const userId = session.user.id;
    let { data: profile } = await supabaseClient.from("profiles").select("*").eq("id", userId).maybeSingle();
    user = profile || {};
    user.payments = user.payments || [];

    document.getElementById("displayUsername").textContent = user.username || "User";
    document.getElementById("profileUsername").value = user.username || "";
    document.getElementById("profileEmail").value = user.email || session.user.email;
    document.getElementById("profileContact").value = user.contact || "";
    document.getElementById("profileAddress").value = user.address || "";

    const sections = {
        profile: document.getElementById("profileSection"),
        orders: document.getElementById("ordersSection"),
        payments: document.getElementById("paymentsSection")
    };

    function showSection(target, btnId) {
        Object.values(sections).forEach(s => s.classList.add("hidden"));
        target.classList.remove("hidden");
        document.querySelectorAll('aside nav button').forEach(b => b.classList.remove('nav-active'));
        document.getElementById(btnId).classList.add('nav-active');
    }

    document.getElementById("sidebarProfileBtn").onclick = () => showSection(sections.profile, 'sidebarProfileBtn');
    document.getElementById("sidebarOrdersBtn").onclick = () => { showSection(sections.orders, 'sidebarOrdersBtn'); loadUserOrders(); };
    document.getElementById("sidebarPaymentsBtn").onclick = () => { showSection(sections.payments, 'sidebarPaymentsBtn'); renderPayments(); };
    // --- UPDATED LOGOUT LOGIC ---
document.getElementById("logoutBtn").onclick = async () => {
    // 1. Clear Supabase Session
    const { error } = await supabaseClient.auth.signOut();
    
    if (error) {
        console.error("Error during logout:", error.message);
    }

    // 2. Clear any potential local storage items just in case
    localStorage.clear(); 
    sessionStorage.clear();

    // 3. Redirect to the Homepage (index.html)
    window.location.href = "index.html";
};

    document.getElementById("saveProfileBtn").onclick = async () => {
        const updates = {
            username: document.getElementById("profileUsername").value,
            contact: document.getElementById("profileContact").value,
            address: document.getElementById("profileAddress").value
        };
        const { error } = await supabaseClient.from("profiles").update(updates).eq("id", userId);
        if (error) alert(error.message);
        else { alert("Profile Updated!"); document.getElementById("displayUsername").textContent = updates.username; }
    };

    await loadUserOrders();
});

// Load Orders
async function loadUserOrders() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const { data } = await supabaseClient.from("orders").select("*").eq("user_id", session.user.id).order("created_at", { ascending: false });
    currentUserOrders = data || [];
    renderUserOrders(currentUserOrders);
}

function renderUserOrders(orders) {
    const list = document.getElementById("ordersList");
    list.innerHTML = orders.length === 0 ? `<div class='text-center py-10 text-gray-400'>No orders found</div>` : "";
    orders.forEach(order => {
        const status = (order.status || 'pending').toLowerCase();
        list.innerHTML += `
            <div class="bg-white border rounded-lg shadow-sm p-4 border-gray-200">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[10px] font-bold text-gray-400 uppercase">#${order.id.substring(0,8)}</span>
                    <span class="text-[10px] font-bold text-orange-600 uppercase">${status}</span>
                </div>
                <div class="flex gap-3">
                    <div class="w-12 h-12 bg-gray-50 rounded border border-gray-100 flex items-center justify-center">⚙️</div>
                    <div class="flex-1">
                        <p class="text-sm font-bold text-gray-800">Auto Parts Kit</p>
                        <p class="text-lg font-bold text-orange-600">₱${Number(order.total_amount).toLocaleString()}</p>
                    </div>
                </div>
                <div class="mt-4 flex gap-2">
                    <button onclick="viewCourierDetails('${order.id}', '${status}')" class="flex-1 py-2 border text-xs font-bold rounded hover:bg-gray-50 transition">Track</button>
                    ${status === 'shipped' ? `<button onclick="confirmReceived('${order.id}')" class="flex-1 py-2 bg-orange-500 text-white text-xs font-bold rounded hover:bg-orange-600 transition">Received</button>` : ''}
                </div>
            </div>`;
    });
}

function filterUserOrders(status) {
    document.querySelectorAll('#ordersSection button').forEach(btn => {
        btn.classList.remove('border-b-2', 'border-orange-500', 'text-orange-500');
        btn.classList.add('text-gray-500');
    });
    document.getElementById(`tab-${status}`).classList.add('border-b-2', 'border-orange-500', 'text-orange-500');
    const filtered = status === 'all' ? currentUserOrders : currentUserOrders.filter(o => (o.status || 'pending').toLowerCase() === status);
    renderUserOrders(filtered);
}

function renderPayments() {
    const list = document.getElementById("paymentList");
    list.innerHTML = user.payments.length === 0 ? "<p class='text-gray-400 text-xs'>No cards saved.</p>" : "";
    user.payments.forEach(p => {
        list.innerHTML += `<div class="border p-4 rounded-lg flex justify-between items-center border-gray-200"><span class="text-sm font-bold text-blue-600">${p.type}</span><span class="text-xs text-gray-500">${p.details}</span></div>`;
    });
}

function viewCourierDetails(orderId, status) {
    document.getElementById("modalTrackingID").innerText = "Tracking: SG-" + orderId.substring(0,8).toUpperCase();
    document.getElementById("trackingModal").classList.remove("hidden");
}

function closeTracking() { document.getElementById("trackingModal").classList.add("hidden"); }
</script>

<!-- Tracking Modal -->
<div id="trackingModal" class="hidden fixed inset-0 bg-black/60 z-[2000] flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-xl w-full max-w-sm p-6 shadow-2xl">
        <h3 class="font-bold mb-4 text-gray-800" id="modalTrackingID">Tracking</h3>
        <div id="trackingTimeline" class="space-y-4 border-l-2 ml-2 pl-4 border-gray-100">
            <p class="text-xs text-gray-500 italic">Tracking details loading...</p>
        </div>
        <button onclick="closeTracking()" class="w-full mt-6 py-3 bg-gray-100 text-gray-600 font-bold rounded-lg hover:bg-gray-200 transition">Close</button>
    </div>
</div>

</body>
</html>
