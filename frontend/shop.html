<!DOCTYPE html>

            display: -webkit-box;

    </style>
</head>

<nav class="sticky top-0 z-[1000] w-full transition-all shadow-xl">

                    <button onclick="location.href='register.html'" class="bg-yellow-400 text-black px-5 py-2 rounded-full font-bold text-xs uppercase hover:bg-yellow-300 transition shadow-lg shadow-yellow-400/20">Join</button>

<div id="sideCart" class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl z-[60] flex flex-col border-l border-slate-100 hidden lg:flex">

        <span id="sideCartCount" class="bg-yellow-400 text-black text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>

            <span id="sideCartTotal" class="text-lg font-black text-slate-900">₱0</span>

        <button onclick="location.href='cart.html'" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-yellow-400 hover:text-black transition-all shadow-lg shadow-slate-200">

<script>
// Global functions for HTML
function closeQuickView() {
    const modal = document.getElementById("quickViewModal");
    modal.classList.replace("flex", "hidden");
}

document.addEventListener("DOMContentLoaded", async () => {
    const supabaseUrl = "https://jimjbjtlekdytvnpyykw.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppbWpianRsZWtkeXR2bnB5eWt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NDM3NzQsImV4cCI6MjA4ODAxOTc3NH0.SZa7CNAx0SWBNsuDqcnrNYS6iwnOmBJ3tD1mSQETZhE";
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    let loggedInUser = null;
    let cart = [];
    let products = [];

    // UI elements
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const mobileMenu = document.getElementById("mobileMenu");
    const userMenuBtn = document.getElementById("userMenuBtn");
    const userMenu = document.getElementById("userMenu");

    mobileMenuBtn.onclick = () => mobileMenu.classList.toggle("hidden");
    userMenuBtn.onclick = (e) => { e.stopPropagation(); userMenu.classList.toggle("hidden"); };
    document.onclick = () => userMenu.classList.add("hidden");

    function updateAuthUI() {
        const guestLinks = document.getElementById("guestLinks");
        const userDropdown = document.getElementById("userDropdown");
        if (loggedInUser) {
            guestLinks.classList.add("hidden");
            userDropdown.classList.remove("hidden");
        } else {
            guestLinks.classList.remove("hidden");
            userDropdown.classList.add("hidden");
        }
        updateMobileAuthUI();
    }

    function updateMobileAuthUI() {
        const container = document.getElementById("mobileAuthContainer");
        if(!container) return;
        container.innerHTML = loggedInUser 
            ? `<button onclick="location.href='account.html'" class="w-full bg-slate-800 text-white p-3 rounded-xl font-bold">My Account</button>
               <button id="mobileLogout" class="w-full border border-red-500 text-red-500 p-3 rounded-xl font-bold">Logout</button>`
            : `<button onclick="location.href='login.html'" class="w-full bg-yellow-400 text-black p-3 rounded-xl font-bold">Sign In</button>
               <button onclick="location.href='register.html'" class="w-full border border-yellow-400 text-yellow-400 p-3 rounded-xl font-bold">Join</button>`;
        
        if(loggedInUser) {
            document.getElementById("mobileLogout").onclick = () => document.getElementById("authLogoutBtn").click();
        }
    }

    document.getElementById("authLogoutBtn").onclick = async () => {
        await supabase.auth.signOut();
        loggedInUser = null;
        cart = [];
        updateAuthUI();
        updateCartCount();
        renderSideCart();
    };

    async function loadProducts() {
        const { data } = await supabase.from("products").select("*, categories(name)").order("id");
        products = data.map(p => ({
            id: p.id,
            name: p.name,
            price: p.price,
            description: p.description,
            variants: p.variants,
            stock: p.stock ?? 0,
            category: p.categories?.name || "Uncategorized",
            img: p.image_url || "assets/images/Default.png"
        }));
        renderProducts();
    }

    function renderProducts() {
        const list = document.getElementById("productsList");
        const filter = document.getElementById("categorySelect").value;
        list.innerHTML = "";
        
        products.filter(p => filter === "All" || p.category === filter).forEach(p => {
            const card = document.createElement("div");
            card.className = "product-card bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-xl";
            card.onclick = () => openQuickView(p);

            card.innerHTML = `
                <div class="h-48 rounded-xl bg-slate-50 flex items-center justify-center mb-4 overflow-hidden relative">
                    <img src="${p.img}" class="h-full w-full object-contain p-4 hover:scale-110 transition duration-500">
                    ${p.stock <= 0 ? '<div class="absolute inset-0 bg-white/60 flex items-center justify-center"><span class="bg-red-500 text-white text-xs font-bold px-3 py-1 rounded">SOLD OUT</span></div>' : ''}
                </div>
                <div class="text-[10px] font-bold text-yellow-600 uppercase tracking-widest mb-1">${p.category}</div>
                <h3 class="font-bold text-slate-900 mb-1 product-name">${p.name}</h3>
                <div class="flex justify-between items-end">
                    <div>
                        <p class="text-xl font-black text-slate-900">₱${Number(p.price).toLocaleString()}</p>
                    </div>
                    <button id="addBtn-${p.id}" ${p.stock <= 0 ? 'disabled' : ''} class="bg-slate-900 text-white h-10 w-10 rounded-lg hover:bg-yellow-400 hover:text-black transition flex items-center justify-center relative z-10 disabled:opacity-50">
                        <i class="fa-solid fa-cart-plus"></i>
                    </button>
                </div>
            `;
            
            card.querySelector(`#addBtn-${p.id}`).onclick = (e) => {
                e.stopPropagation(); 
                addToCart(p.id);
            };
            list.appendChild(card);
        });
    }

    function openQuickView(p) {
        const modal = document.getElementById("quickViewModal");
        
        document.getElementById("qvName").textContent = p.name;
        document.getElementById("qvPrice").textContent = `₱${Number(p.price).toLocaleString()}`;
        document.getElementById("qvImage").src = p.img;
        document.getElementById("qvCategory").textContent = p.category;
        document.getElementById("qvStock").textContent = `Available: ${p.stock}`;
        document.getElementById("qvDesc").textContent = p.description || "Premium quality auto part.";

        const variantContainer = document.getElementById("variantOptions");
        variantContainer.innerHTML = ""; 

       let selectedVariant = null;

let vars = [];

try {
    vars = typeof p.variants === "string"
        ? JSON.parse(p.variants)
        : p.variants || [];
} catch {
    vars = [];
}

vars.forEach((v, index) => {

    const btn = document.createElement("button");

    btn.className = `
        variant-btn
        border
        rounded-xl
        overflow-hidden
        w-20
        hover:border-yellow-500
        transition
        bg-white
    `;

    btn.innerHTML = `
        <div class="h-14 bg-gray-50 flex items-center justify-center">
            <img src="${v.img || p.img}" class="h-full object-contain">
        </div>

        <div class="text-[10px] font-semibold p-2 text-center">
            ${v.color}
        </div>
    `;

    btn.onclick = () => {

        selectedVariant = v.color;

        document.getElementById("qvImage").src = v.img || p.img;

        document.querySelectorAll(".variant-btn").forEach(el => {
            el.classList.remove(
                "border-yellow-500",
                "ring-2",
                "ring-yellow-400"
            );
        });

        btn.classList.add(
            "border-yellow-500",
            "ring-2",
            "ring-yellow-400"
        );
    };

    variantContainer.appendChild(btn);

    // auto select first variant
    if (index === 0) {
        btn.click();
    }
});

        const addBtn = document.getElementById("qvAddToCartBtn");
        addBtn.onclick = () => addToCart(p.id, selectedVariant);
        addBtn.disabled = p.stock <= 0;
        addBtn.innerHTML = p.stock <= 0 ? "OUT OF STOCK" : `<i class="fa-solid fa-cart-plus mr-2"></i> Add to Cart`;

        modal.classList.remove("hidden");
        modal.classList.add("flex");
    }

   async function addToCart(productId, selectedVariant = null) {
    if (!loggedInUser) {
        window.location.href = 'login.html';
        return;
    }

    const p = products.find(x => x.id === productId);
    if (!p) return;

    if (p.stock <= 0) {
        alert("Out of stock!");
        return;
    }

    let existing = cart.find(c =>
        c.product_id === productId &&
        c.variant === selectedVariant
    );

    if (existing) {

        existing.quantity++;

        await supabase
            .from("carts")
            .update({ quantity: existing.quantity })
            .eq("id", existing.id);

    } else {

        const { data, error } = await supabase
            .from("carts")
            .insert([{
                user_id: loggedInUser,
                product_id: productId,
                quantity: 1,
                variant: selectedVariant
            }])
            .select()
            .single();

        if (error) {
            console.error(error);
            return;
        }

        cart.push({
            ...data,
            products: {
                name: p.name,
                price: p.price,
                image_url: p.img
            }
        });
    }

    p.stock--;

    await supabase
        .from("products")
        .update({ stock: p.stock })
        .eq("id", productId);

    updateCartCount();
    renderSideCart();
    renderProducts();
}

    async function loadCart() {
        if (!loggedInUser) return;
        const { data, error } = await supabase
            .from("carts")
            .select("*, products(*)")
            .eq("user_id", loggedInUser);

        if (error) { console.error(error); return; }
        cart = data || [];
        updateCartCount();
        renderSideCart(); 
    }

    // --- ATTACH TO WINDOW SO ONCLICK WORKS ---

window.updateCartQty = async (productId, variant, change) => {

    console.log("update qty clicked");

    const item = cart.find(c =>
        String(c.product_id) === String(productId) &&
        String(c.variant || "") === String(variant || "")
    );

    if (!item) {
        console.log("item not found");
        return;
    }

    const product = products.find(p =>
        String(p.id) === String(productId)
    );

    if (!product) {
        console.log("product not found");
        return;
    }

    if (change > 0 && product.stock <= 0) {
        alert("No more stock available");
        return;
    }

    const newQty = item.quantity + change;

    if (newQty <= 0) {
        await window.removeFromCart(productId, variant);
        return;
    }

    item.quantity = newQty;

    if (change > 0) {
        product.stock--;
    } else {
        product.stock++;
    }

    renderSideCart();
    updateCartCount();
    renderProducts();

    await supabase
        .from("carts")
        .update({
            quantity: newQty
        })
        .eq("id", item.id);

    await supabase
        .from("products")
        .update({
            stock: product.stock
        })
        .eq("id", product.id);
};

window.removeFromCart = async (productId, variant) => {

    console.log("remove clicked");

    const itemIndex = cart.findIndex(c =>
        String(c.product_id) === String(productId) &&
        String(c.variant || "") === String(variant || "")
    );

    if (itemIndex === -1) {
        console.log("item not found");
        return;
    }

    const item = cart[itemIndex];

    const product = products.find(p =>
        String(p.id) === String(productId)
    );

    if (product) {

        product.stock += item.quantity;

        await supabase
            .from("products")
            .update({
                stock: product.stock
            })
            .eq("id", product.id);
    }

    cart.splice(itemIndex, 1);

    renderSideCart();
    updateCartCount();
    renderProducts();

    await supabase
        .from("carts")
        .delete()
        .eq("id", item.id);
};

function renderSideCart() {
    const container = document.getElementById("sideCartItems");
    const totalElem = document.getElementById("sideCartTotal");
    
    if (!container) return;
    container.innerHTML = "";
    let total = 0;

    if (cart.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-400 text-[10px] mt-10 italic">Your cart is empty</p>`;
        if (totalElem) totalElem.textContent = "₱0";
        return;
    }

    cart.forEach(item => {
        const productData = item.products || {};

const itemPrice = Number(productData.price || 0);
        total += itemPrice * item.quantity;
        
        const itemDiv = document.createElement("div");
        // flex-nowrap and gap-2 stops the squishing
        itemDiv.className = "flex items-center justify-between bg-white p-2 rounded-xl border border-slate-100 shadow-sm gap-2";
        
        itemDiv.innerHTML = `
            <div class="flex items-center space-x-2 flex-1 min-w-0">
                <img src="${productData.image_url || 'assets/images/Default.png'}" class="w-8 h-8 object-contain rounded-md bg-slate-50 flex-shrink-0">
                <div class="min-w-0 flex-1">
                    <h4 class="text-[10px] font-bold text-slate-800 truncate">${productData.name || 'Product'}</h4>
                    <p class="text-[8px] text-gray-400">
    ${item.variant || ""}
</p>
                    <p class="text-[9px] text-emerald-600 font-bold">₱${itemPrice.toLocaleString()}</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-1 flex-shrink-0">
                <div class="flex items-center bg-slate-100 rounded-lg border border-slate-200 overflow-hidden">
                    <button onclick="updateCartQty('${item.product_id}', '${item.variant || ""}', -1)" class="px-2 py-1 hover:bg-white transition text-[10px] font-bold text-slate-600">-</button>
                    <span class="px-1 text-[10px] font-black text-slate-900 min-w-[14px] text-center">${item.quantity}</span>
                    <button onclick="updateCartQty('${item.product_id}', '${item.variant || ""}', 1)" class="px-2 py-1 hover:bg-white transition text-[10px] font-bold text-slate-600">+</button>
                </div>
                
                <button onclick="removeFromCart('${item.product_id}', '${item.variant || ""}')" class="text-red-400 hover:text-red-600 transition-colors p-1">
                    <i class="fa-solid fa-trash-can text-[11px]"></i>
                </button>
            </div>
        `;
        container.appendChild(itemDiv);
    });

    if (totalElem) totalElem.textContent = `₱${total.toLocaleString()}`;
}

    function updateCartCount() {
        const total = cart.reduce((s, c) => s + c.quantity, 0);
        const countElem = document.getElementById("cartCount");
        const countMobileElem = document.getElementById("cartCountMobile");
        if(countElem) countElem.textContent = total;
        if(countMobileElem) countMobileElem.textContent = total;
    }

    // Load Categories
    const { data: cats } = await supabase.from("categories").select("name");
    cats?.forEach(c => {
        const opt = document.createElement("option");
        opt.value = opt.textContent = c.name;
        document.getElementById("categorySelect").appendChild(opt);
    });

    document.getElementById("categorySelect").onchange = renderProducts;

    // Get Auth Session
    const { data: { session } } = await supabase.auth.getSession();
    if(session) loggedInUser = session.user.id;
    
    updateAuthUI();
    await loadProducts();
    await loadCart();

    document.getElementById("quickViewModal").onclick = (e) => {
        if (e.target.id === "quickViewModal") closeQuickView();
    };
});
</script>
</body>
