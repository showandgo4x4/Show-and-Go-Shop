<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Quote - Show & Go Auto Shop</title>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.35.0/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0a0a0a; }
        
        /* Custom scrollbar for the modal */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #facc15; border-radius: 10px; }

        input:focus, textarea:focus, select:focus { 
            outline: none; 
            border-color: #facc15 !important;
            box-shadow: 0 0 0 1px #facc15; 
        }

        #quoteModal { transition: opacity 0.3s ease; }
        #quoteModal.hide { opacity: 0; pointer-events: none; }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 0.75rem;
            color: white;
            transition: all 0.2s;
        }

        #toast { 
            position: fixed; top: 20px; right: 20px; 
            padding: 12px 24px; border-radius: 12px; 
            font-weight: 600; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); 
            z-index: 9999; pointer-events: none;
            opacity: 0; transform: translateY(-20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

<!-- Notification Toast -->
<div id="toast"></div>

<!-- Quote Section / Modal -->
<section id="quoteModal" class="fixed inset-0 flex items-center justify-center bg-black/80 backdrop-blur-sm z-50 p-4">
    <div class="bg-gray-900 border border-yellow-500/30 rounded-3xl shadow-2xl relative w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col">
        
        <!-- Header -->
        <div class="p-6 md:p-8 border-b border-gray-800 bg-gray-900/50 sticky top-0 z-10">
            <button id="goBackBtn" class="absolute top-6 left-6 text-gray-400 hover:text-yellow-400 transition text-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                Back
            </button>
            
            <div class="text-center mt-4">
                <h2 class="text-2xl md:text-3xl font-extrabold text-yellow-400 uppercase tracking-tight">Get a Service Quote</h2>
                <p class="text-gray-400 text-sm mt-1">Professional care for your vehicle starts here.</p>
            </div>
        </div>

        <!-- Form Body (Scrollable) -->
        <div class="p-6 md:p-8 overflow-y-auto custom-scroll">
            <form id="quoteForm" class="space-y-6">
                <!-- Personal Info -->
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2 ml-1">Full Name *</label>
                        <input type="text" id="name" placeholder="Juan Dela Cruz" class="form-input" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2 ml-1">Phone Number *</label>
                        <input type="tel" id="phone" placeholder="0912 345 6789" class="form-input" required>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-2 ml-1">Email Address *</label>
                    <input type="email" id="email" placeholder="example@email.com" class="form-input" required>
                </div>

                <!-- Vehicle Info -->
                <div class="grid md:grid-cols-2 gap-4 pt-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2 ml-1">Vehicle Model</label>
                        <input type="text" id="vehicle" placeholder="e.g. Toyota Hilux" class="form-input">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2 ml-1">Plate Number</label>
                        <input type="text" id="plate" placeholder="ABC 1234" class="form-input">
                    </div>
                </div>

                <!-- Service Selection -->
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-2 ml-1">Required Service *</label>
                    <select id="service" class="form-input appearance-none" required>
                        <option value="" disabled selected>Choose a service...</option>
                        <option>Oil Change</option>
                        <option>Brake Replacement</option>
                        <option>Suspension Upgrade</option>
                        <option>Engine Diagnostics</option>
                        <option>General Maintenance</option>
                        <option>Other</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-2 ml-1">Additional Details</label>
                    <textarea id="message" rows="3" placeholder="Tell us more about the issue..." class="form-input"></textarea>
                </div>

                <!-- File Upload -->
                <div class="bg-gray-800/50 p-4 rounded-xl border border-dashed border-gray-700">
                    <label class="block text-sm font-bold text-yellow-400 mb-2">Upload Vehicle Photos</label>
                    <p class="text-[10px] text-gray-500 mb-3 uppercase tracking-widest">Max 5 images allowed</p>
                    <input type="file" id="photos" accept="image/*" multiple class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-yellow-400 file:text-black hover:file:bg-yellow-300 cursor-pointer">
                    <div id="previewContainer" class="flex gap-3 overflow-x-auto mt-4 pb-2"></div>
                </div>

                <!-- Submit -->
                <button type="submit" class="w-full bg-yellow-400 text-black py-4 rounded-xl font-bold uppercase tracking-widest hover:bg-yellow-300 transform active:scale-[0.98] transition-all shadow-lg shadow-yellow-400/20">
                    Submit Quote Request
                </button>
            </form>
        </div>
    </div>
</section>

<script>
const supabaseUrl = "https://jimjbjtlekdytvnpyykw.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppbWpianRsZWtkeXR2bnB5eWt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NDM3NzQsImV4cCI6MjA4ODAxOTc3NH0.SZa7CNAx0SWBNsuDqcnrNYS6iwnOmBJ3tD1mSQETZhE"; 
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

function showToast(message, color = "#22c55e") {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.style.backgroundColor = color;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);
}

document.addEventListener("DOMContentLoaded", () => {
    const quoteForm = document.getElementById("quoteForm");
    const photosInput = document.getElementById("photos");
    const previewContainer = document.getElementById("previewContainer");
    const quoteModal = document.getElementById("quoteModal");

    document.getElementById("goBackBtn").addEventListener("click", () => {
        quoteModal.classList.add("hide");
        setTimeout(() => window.history.back(), 300);
    });

    // Photo preview
    photosInput.addEventListener("change", () => {
        previewContainer.innerHTML = "";
        Array.from(photosInput.files).forEach(file => {
            const img = document.createElement("img");
            img.src = URL.createObjectURL(file);
            img.className = "h-20 w-20 object-cover rounded-xl border-2 border-gray-700 shadow-md";
            previewContainer.appendChild(img);
        });
    });

    quoteForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;
        const vehicle = document.getElementById("vehicle").value;
        const plate = document.getElementById("plate").value;
        const service = document.getElementById("service").value;
        const message = document.getElementById("message").value;

        const files = photosInput.files;
        const photoUrls = [];

        // Show loading state on button
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.innerText;
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing...";

        try {
            for (let i = 0; i < Math.min(files.length, 5); i++) {
                const file = files[i];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${i}.${fileExt}`; 

                const { data, error: uploadError } = await supabaseClient.storage
                    .from('quote-photos') 
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                const { data: publicUrlData } = supabaseClient.storage
                    .from('quote-photos')
                    .getPublicUrl(fileName);

                photoUrls.push(publicUrlData.publicUrl);
            }

            const { data: inserted, error: insertError } = await supabaseClient
                .from('quotes')
                .insert([{ name, email, phone, vehicle, plate, service, message, photos: photoUrls }]);

            if (insertError) throw insertError;

            quoteForm.reset();
            previewContainer.innerHTML = "";
            showToast("✅ Your quote has been submitted!");
            quoteModal.classList.add("hide");
            setTimeout(() => window.location.href = "index.html", 1500);

        } catch (err) {
            console.error(err);
            showToast("Failed to submit quote.", "#ef4444");
            submitBtn.disabled = false;
            submitBtn.innerText = originalBtnText;
        }
    });
});
</script>
</body>
</html>
